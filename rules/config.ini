[custom]

;--- 节点重命名 ---
;Flower 节点 — 简化 IEPL 名称（参考 dler 风格）
rename=实验性 IEPL 专线@IEPL [Flower]
rename=标准 IEPL 专线@IEPL [Flower]
rename=高级 IEPL 专线@IEPL [Flower]

;--- 策略组（英文命名，参考 dler 布局）---

;主选择
custom_proxy_group=🚀 Proxy`select`[]⚡ Auto - UrlTest`[]🇭🇰 Hong Kong`[]🇯🇵 Japan`[]🇸🇬 Singapore`[]🇺🇸 United States`[]🇨🇳 Taiwan`[]🇰🇷 Korea`[]🇬🇧 Europe`[]🌍 Others`[]DIRECT
custom_proxy_group=🏠 Domestic`select`[]DIRECT`[]🚀 Proxy
custom_proxy_group=🛑 AdBlock`select`[]REJECT`[]DIRECT
custom_proxy_group=🚫 HTTPDNS`select`[]DIRECT`[]REJECT

;地区 url-test
custom_proxy_group=🇭🇰 Hong Kong`url-test`(港|HK|Hong Kong|香港)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 Japan`url-test`(日|JP|Japan|日本)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 Singapore`url-test`(新|SG|Singapore|新加坡)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 United States`url-test`(美|US|United States|美国)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇨🇳 Taiwan`url-test`(台|TW|Taiwan|台湾)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 Korea`url-test`(韩|KR|Korea|韩国)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇬🇧 Europe`url-test`(英|德|俄|法|DE|GB|UK|RU|FR|英国|德国|俄罗斯)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🌍 Others`url-test`(马来|越南|印尼|印度|菲律宾|泰国|澳大利亚|墨西哥|加拿大|巴西|尼日利亚|新西兰|埃及)`http://www.gstatic.com/generate_204`300,,50

;自动测试
custom_proxy_group=⚡ Auto - UrlTest`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔄 Auto - Smart`fallback`.*`http://www.gstatic.com/generate_204`300,,50

;手动切换
custom_proxy_group=✅ Manual`select`.*

;AI（合并所有 AI 服务）
custom_proxy_group=🤖 AI Suite`select`[]🚀 Proxy`[]🇺🇸 United States`[]🇯🇵 Japan`[]🇸🇬 Singapore`[]🇬🇧 Europe`[]DIRECT

;流媒体
custom_proxy_group=📺 Emby`select`[]🚀 Proxy`[]🇭🇰 Hong Kong`[]🇸🇬 Singapore`[]DIRECT
custom_proxy_group=📺 Netflix`select`[]🚀 Proxy`[]🇭🇰 Hong Kong`[]🇸🇬 Singapore`[]🇯🇵 Japan`[]🇺🇸 United States
custom_proxy_group=📺 Disney Plus`select`[]🚀 Proxy`[]🇭🇰 Hong Kong`[]🇯🇵 Japan`[]🇺🇸 United States
custom_proxy_group=📺 YouTube`select`[]🚀 Proxy`[]🇭🇰 Hong Kong`[]🇯🇵 Japan`[]🇺🇸 United States
custom_proxy_group=🎵 Spotify`select`[]🚀 Proxy`[]DIRECT
custom_proxy_group=📺 Streaming`select`[]🚀 Proxy`[]🇭🇰 Hong Kong`[]🇨🇳 Taiwan`[]DIRECT

;社交（含 Telegram）
custom_proxy_group=💬 Social`select`[]🚀 Proxy`[]🔄 Auto - Smart`[]🇸🇬 Singapore`[]DIRECT

;加密货币
custom_proxy_group=💰 Crypto`select`[]🚀 Proxy`[]DIRECT

;游戏
custom_proxy_group=🎮 Gaming`select`[]DIRECT`[]🚀 Proxy

;Apple
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🚀 Proxy

;兜底
custom_proxy_group=🐟 Final`select`[]🚀 Proxy`[]DIRECT`[]⚡ Auto - UrlTest

